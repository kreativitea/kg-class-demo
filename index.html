<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Earthquakes around Japan</title>
<style>
  :root{
    --bg:#05080f; --ink:#e9eef5; --muted:#8fa3b8; --dim:#5b7086;
    --panel:rgba(9,16,26,.86); --line:rgba(120,160,200,.20);
    --ocean:#08111c; --land:#16232f; --coast:#2f4a5f;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans",sans-serif;
    -webkit-font-smoothing:antialiased}
  canvas{display:block;position:absolute;left:0}
  #map{top:0}
  #sec{bottom:0;display:none}

  .panel{position:absolute;z-index:5;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 34px rgba(0,0,0,.5)}
  h1{margin:0;font-size:17px;font-weight:650;letter-spacing:.005em}
  .sub{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
  .lab{font-size:10.5px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}

  #head{top:14px;left:14px;padding:13px 16px 12px;max-width:330px}
  #lang{display:inline-flex;margin-top:10px;border:1px solid var(--line);
    border-radius:7px;overflow:hidden}
  #lang button{flex:none;border:0;border-radius:0;padding:4px 11px;font-size:11.5px;
    background:transparent;color:var(--muted)}
  #lang button.on{background:#2a6fa8;color:var(--ink)}
  #count{margin-top:9px;font-size:12.5px;color:var(--muted)}
  #clock{margin-top:5px;font-size:15px;font-weight:600;color:var(--ink);
    font-variant-numeric:tabular-nums;letter-spacing:.01em}
  #clock:empty{display:none}
  #count b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}

  #legend{bottom:14px;left:14px;padding:13px 16px 14px;width:230px}
  #ramp{height:11px;border-radius:3px;margin:7px 0 5px}
  .ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);
    font-variant-numeric:tabular-nums}
  .mags{display:flex;align-items:flex-end;gap:12px;height:50px;margin:12px 0 2px;padding-left:3px}
  .mags i{display:block;border-radius:50%;background:rgba(157,180,201,.18);border:1.4px solid #9db4c9}
  .mags span{font-size:10.5px;color:var(--dim);display:block;text-align:center;margin-top:4px}
  .mcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
  hr{border:0;border-top:1px solid var(--line);margin:13px 0 2px}

  #ctl{top:14px;right:14px;padding:13px 16px 15px;width:252px}
  .grp{margin-top:13px}
  .grp:first-child{margin-top:2px}
  .val{float:right;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;
    text-transform:none;letter-spacing:0;font-size:11.5px}
  .dual{position:relative;height:22px;margin-top:5px}
  .dual input{position:absolute;left:0;top:0;width:100%;margin:0;background:none;pointer-events:none;
    -webkit-appearance:none;appearance:none;height:22px}
  .dual input::-webkit-slider-runnable-track{height:3px;background:transparent}
  .dual input::-moz-range-track{height:3px;background:transparent}
  .dual::before{content:"";position:absolute;left:0;right:0;top:9.5px;height:3px;
    background:rgba(120,160,200,.22);border-radius:2px}
  .fill{position:absolute;top:9.5px;height:3px;background:#5aa9e6;border-radius:2px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;
    width:14px;height:14px;border-radius:50%;background:#e9eef5;
    border:2px solid #16232f;box-shadow:0 1px 4px rgba(0,0,0,.6);cursor:grab;margin-top:-5.5px}
  input[type=range]::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;border-radius:50%;
    background:#e9eef5;border:2px solid #16232f;box-shadow:0 1px 4px rgba(0,0,0,.6);cursor:grab}
  .row{display:flex;gap:7px;margin-top:13px}
  button{flex:1;font:inherit;font-size:12px;font-weight:550;color:var(--ink);cursor:pointer;
    background:rgba(120,160,200,.11);border:1px solid var(--line);border-radius:7px;padding:7px 4px;
    transition:background .13s}
  button:hover{background:rgba(120,160,200,.2)}
  button.on{background:#2a6fa8;border-color:#3d8ac7}

  #tip{position:absolute;z-index:9;pointer-events:none;opacity:0;transition:opacity .1s;
    background:rgba(6,12,20,.95);border:1px solid var(--line);border-radius:9px;padding:9px 12px;
    font-size:12.5px;max-width:250px;box-shadow:0 8px 26px rgba(0,0,0,.6)}
  #tip .m{font-size:15px;font-weight:700;letter-spacing:.01em}
  #tip .p{color:var(--muted);margin-top:2px}
  #tip .d{color:var(--dim);margin-top:5px;font-size:11.5px;font-variant-numeric:tabular-nums}
  #hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:4;
    font-size:11.5px;color:var(--dim);white-space:nowrap;pointer-events:none;
    text-shadow:0 1px 6px #000}
  #src{position:absolute;bottom:14px;right:14px;z-index:4;font-size:11px;color:var(--dim);
    text-shadow:0 1px 6px #000}
  #src a{color:var(--muted);text-decoration:none}
  #src a:hover{text-decoration:underline}
  @media (max-width:900px){#legend{display:none}#ctl{width:210px}#head{max-width:250px}}
</style>
</head>
<body>
<canvas id="map"></canvas>
<canvas id="sec"></canvas>

<div class="panel" id="head">
  <h1 data-i18n="title">Earthquakes around Japan</h1>
  <p class="sub" data-i18n="sub">Every recorded quake of magnitude 4.0 and above, 2016&ndash;2026.</p>
  <div id="count"></div>
  <div id="clock"></div>
  <div id="lang"><button data-lang="en">EN</button><button data-lang="ja">日本語</button></div>
</div>

<div class="panel" id="legend">
  <div class="lab" data-i18n="colourDepth">Colour &mdash; depth</div>
  <div id="ramp"></div>
  <div class="ticks" id="ticks"></div>
  <hr>
  <div class="lab" style="margin-top:11px" data-i18n="sizeMag">Size &mdash; magnitude</div>
  <div class="mags" id="msc"></div>
</div>

<div class="panel" id="ctl">
  <div class="grp">
    <div class="lab"><span data-i18n="magnitude">Magnitude</span> <span class="val" id="mv"></span></div>
    <div class="dual"><div class="fill" id="mf"></div>
      <input type="range" id="m0" min="4" max="8" step="0.1" value="4">
      <input type="range" id="m1" min="4" max="8" step="0.1" value="8"></div>
  </div>
  <div class="grp">
    <div class="lab"><span data-i18n="depth">Depth</span> <span class="val" id="dv"></span></div>
    <div class="dual"><div class="fill" id="df"></div>
      <input type="range" id="d0" min="0" max="700" step="5" value="0">
      <input type="range" id="d1" min="0" max="700" step="5" value="700"></div>
  </div>
  <div class="grp">
    <div class="lab"><span data-i18n="year">Year</span> <span class="val" id="yv"></span></div>
    <div class="dual"><div class="fill" id="yf"></div>
      <input type="range" id="y0" min="0" max="1" step="1" value="0">
      <input type="range" id="y1" min="0" max="1" step="1" value="1"></div>
  </div>
  <div class="row">
    <button id="play" style="flex:2.2"></button>
    <button id="spd"></button>
  </div>
  <div class="row">
    <button id="reset" data-i18n="reset">Reset</button>
    <button id="xs" data-i18n="section">Cross-section</button>
  </div>
</div>

<div id="tip"></div>
<div id="hint" data-i18n="hint">Scroll to zoom &middot; drag to pan &middot; hover a circle for detail</div>
<div id="src"><!-- attribution stays English -->Data: <a href="https://earthquake.usgs.gov" target="_blank" rel="noopener">USGS</a>
  &middot; coastlines: Natural Earth</div>

const T0    = Date.UTC(2016,0,1);
const DIRS  = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];

/* ---- the two encodings ------------------------------------------------ */
// SIZE = magnitude. A magnitude step is ~32x the energy, and 90% of these
// quakes are under M5, so the curve has to be steep or the rare big ones
// vanish into the crowd. 2.45x radius per step: M4 is 1px, M7 is 15px and
// the M7.6 is 25px — about 630x the area of an M4. Past 6px they are drawn
// as rings rather than discs, so a big one does not hide what is under it.
const radius = m => Math.pow(2.45, m - 4);

// COLOUR = depth, as a full rainbow. The stops are not evenly spaced in
// kilometres on purpose: two thirds of these quakes are shallower than 50 km,
// so a scale that was linear in depth spent the whole rainbow on the empty
// deep end and painted the map one shade of red. Crowding the stops where the
// data actually is spends the rainbow where it can be seen.
const STOPS = [[0,  255, 42, 42], [15, 255,126,  0], [30, 255,214,  0],
               [50, 124,222, 58], [80,  16,212,190], [130, 48,140,255],
               [250,150, 96,246], [450,255, 62,175], [700,255,158,222]];
const NSEG = STOPS.length - 1;
function depthRGB(d){
  for(let i=1;i<=NSEG;i++){
    if(d<=STOPS[i][0] || i===NSEG){
      const a=STOPS[i-1], b=STOPS[i];
      const t=Math.min(1,Math.max(0,(d-a[0])/(b[0]-a[0])));
      return [a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t, a[3]+(b[3]-a[3])*t];
    }
  }
}
// where a depth sits along the ramp, 0..1 — each stop gets an equal slice, so
// the legend shows the whole rainbow rather than a red bar with a blue tip
function depthPos(d){
  for(let i=1;i<=NSEG;i++){
    if(d<=STOPS[i][0] || i===NSEG){
      const a=STOPS[i-1][0], b=STOPS[i][0];
      return ((i-1) + Math.min(1,Math.max(0,(d-a)/(b-a)))) / NSEG;
    }
  }
}
const depthCSS = d => { const c=depthRGB(d); return `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`; };

/* ---- events, sorted small-first so the big ones land on top ----------- */
const Q = RAW.map(r=>({lon:r[0],lat:r[1],dep:r[2],mag:r[3],t:T0+r[4]*3600000,
                       dist:r[5],dir:r[6],name:r[7]}))
             .sort((a,b)=>a.mag-b.mag);
for(const q of Q){ const c=depthRGB(q.dep); q.col=`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`; q.r=radius(q.mag); }
const YR0 = 2016, YR1 = new Date(Math.max(...Q.map(q=>q.t))).getUTCFullYear();

/* ---- projection: Mercator, then a pan/zoom transform ------------------ */
const cv=document.getElementById('map'), g=cv.getContext('2d');
const VIEW = {w:122.0, e:149.5, s:23.5, n:46.8};
// Mercator, scaled back into degree-sized units so that x (plain longitude
// degrees) and y are measured on the same ruler. Without the 180/PI the map
// comes out squashed flat.
const R2D = 180/Math.PI;
const mercY = lat => R2D * Math.log(Math.tan(Math.PI/4 + lat*Math.PI/360));
const MYn = mercY(VIEW.n), MYs = mercY(VIEW.s);   // north edge is the larger value
const LONW = VIEW.e - VIEW.w, MERH = MYn - MYs;  // view size in projected units
let cw=0, ch=0, base=1, ox=0, oy=0, zoom=1, panx=0, pany=0, dpr=1;


// project, then apply zoom about the canvas centre plus the pan offset
const X = lon => (ox + (lon-VIEW.w)*base - cw/2)*zoom + cw/2 + panx;
const Y = lat => (oy + (MYn-mercY(lat))*base - ch/2)*zoom + ch/2 + pany;
// and the inverse, for reading a longitude/latitude back out of a click
const invLon = px => VIEW.w + (((px-panx-cw/2)/zoom + cw/2) - ox)/base;
const invLat = py => {
  const m = MYn - (((py-pany-ch/2)/zoom + ch/2) - oy)/base;
  return (Math.atan(Math.exp(m/R2D))*360/Math.PI) - 90;
};

/* ---- the clock --------------------------------------------------------
   Playback sweeps a cursor through the decade and lets each quake strike as
   its own moment arrives. The catalogue is stored to the hour, so the order
   of an aftershock sequence is real, not an approximation.               */
const DAY = 86400000;
const SPEEDS = [1, 2, 4];
let speedIdx = 0, playing = false, animT = 0, struckCount = 0;
const daysPerSec = () => 78 * SPEEDS[speedIdx];   // the decade in ~50s at 1x

// A strike stays lit for a fixed span of *wall* time, converted to model time,
// so the flash looks the same at any speed. A big quake rings longer.
const pulseSecs = m => 0.55 + Math.max(0, m-4)*0.38;      // M4 0.55s, M7.6 1.9s
const pulseSpan = m => pulseSecs(m) * daysPerSec() * DAY;

// Only the notable ones throw a ring. There are ~1,150 M4+ quakes a year here,
// so at any watchable speed ringing all of them is just noise; ringing M5.5+
// (about 8 a second at 1x) gives the field punctuation you can actually see.
const RING_MIN_MAG = 5.5;

/* ---- filters ---------------------------------------------------------- */
const F = {m0:4, m1:8, d0:0, d1:700, y0:YR0, y1:YR1};
let shown = [];
function refilter(){
  const a=Date.UTC(F.y0,0,1), b=Date.UTC(F.y1+1,0,1);
  shown = Q.filter(q=> q.mag>=F.m0-1e-9 && q.mag<=F.m1+1e-9 &&
                       q.dep>=F.d0 && q.dep<=F.d1 && q.t>=a && q.t<b);
}                       // setCount() owns the readout — the two languages
                        // order that sentence differently

/* ---- drawing ---------------------------------------------------------- */
function draw(){
  g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle='#08111c'; g.fillRect(0,0,cw,ch);

  // graticule
  g.strokeStyle='rgba(90,130,170,.09)'; g.lineWidth=1;
  for(let lo=125;lo<=150;lo+=5){ g.beginPath(); g.moveTo(X(lo),0); g.lineTo(X(lo),ch); g.stroke(); }
  for(let la=25;la<=45;la+=5){ g.beginPath(); g.moveTo(0,Y(la)); g.lineTo(cw,Y(la)); g.stroke(); }

  // land
  g.fillStyle='#1c2d3d'; g.strokeStyle='#5b8299'; g.lineWidth=Math.min(1.3,.8*zoom+.5);
  g.beginPath();
  for(const ring of COAST){
    g.moveTo(X(ring[0][0]), Y(ring[0][1]));
    for(let i=1;i<ring.length;i++) g.lineTo(X(ring[i][0]), Y(ring[i][1]));
    g.closePath();
  }
  g.fill(); g.stroke();

  // quakes. While the clock runs, only those that have already happened are
  // drawn, and one that just struck throws an expanding ring.
  const rs = Math.pow(zoom,.42);
  const pulses = [];
  struckCount = 0;
  for(const q of shown){
    if(playing && q.t > animT) continue;
    struckCount++;
    const x=X(q.lon), y=Y(q.lat), r=q.r*rs;
    if(x<-r||x>cw+r||y<-r||y>ch+r) continue;
    const age = playing ? (animT - q.t)/pulseSpan(q.mag) : 2;  // 0..1 while lit
    const hot = age <= 1;
    if(hot && q.mag >= RING_MIN_MAG) pulses.push([x, y, r, age, q.col, q.mag]);
    g.beginPath(); g.arc(x,y,r,0,7);
    if(r>6){                            // a big quake is drawn as a ring: at
      g.globalAlpha = hot ? .45 : .22;  // this size a solid disc would hide
      g.fillStyle=q.col; g.fill();      // everything underneath it
      g.globalAlpha=.95; g.lineWidth=Math.min(3, r*.16+1.1);
      g.strokeStyle=q.col; g.stroke();
    } else {
      g.globalAlpha = hot ? 1 : (q.mag>=5 ? .9 : .68);
      g.fillStyle=q.col; g.fill();
    }
  }
  // the shockwaves go on top of everything, so a strike reads through a crowd
  for(const [x,y,r,age,col,mag] of pulses){
    const k = 1-age;
    g.beginPath(); g.arc(x, y, r + (r*3.5 + 12 + (mag-4)*20)*age, 0, 7);
    g.globalAlpha = k*k*.85; g.lineWidth = 1 + 2.6*k;
    g.strokeStyle = col; g.stroke();
  }
  g.globalAlpha=1;

  // cities last, so they stay readable over a dense field of dots
  g.font=`600 11px ${FONT}`;
  g.lineWidth=3; g.strokeStyle='rgba(3,7,12,.85)'; g.lineJoin='round';
  for(const [en,ja,lo,la] of CITIES){
    const nm = lang==='ja' ? ja : en;
    const x=X(lo), y=Y(la);
    if(x<-40||x>cw+40||y<-20||y>ch+20) continue;
    g.beginPath(); g.arc(x,y,2.4,0,7);
    g.stroke(); g.fillStyle='rgba(232,242,250,.95)'; g.fill();
    g.strokeText(nm, x+6, y+3.5); g.fillText(nm, x+6, y+3.5);
  }
}
const FONT = '-apple-system,"Hiragino Sans","Noto Sans JP","Segoe UI",Roboto,sans-serif';
const CITIES=[["Tokyo","東京",139.69,35.68],["Osaka","大阪",135.50,34.69],
  ["Sapporo","札幌",141.35,43.06],["Fukuoka","福岡",130.40,33.59],
  ["Sendai","仙台",140.87,38.27],["Naha","那覇",127.68,26.21],
  ["Niigata","新潟",139.02,37.90]];
</script>
<script>
/* ---- cross-section: the same events seen from the side ---------------- */
/* x is longitude, matched to the map above, so a feature on the map sits
   directly over its own depth profile. y is depth, 0 at the top.          */
const sc = document.getElementById('sec'), sg = sc.getContext('2d');
let secOn = false, SECH = 0, band = {c:38.6, h:3.4};   // Tohoku, the textbook slab
const MAXD = 700;

// one place that sizes everything. CSS is deliberately not involved in the
// canvas dimensions: a `height:100%` rule silently beats a `bottom` offset,
// which left the map full-height and merely clipped.
function relayout(){
  dpr  = Math.min(window.devicePixelRatio||1, 2);
  SECH = secOn ? Math.max(150, Math.min(300, Math.round(window.innerHeight*0.30))) : 0;
  cw   = window.innerWidth;
  ch   = window.innerHeight - SECH;
  for(const [el,h] of [[cv,ch],[sc,SECH]]){
    el.style.width = cw+'px'; el.style.height = h+'px';
    el.width = Math.round(cw*dpr); el.height = Math.round(h*dpr);
  }
  sc.style.display = secOn ? 'block' : 'none';
  base = Math.min(cw/LONW, ch/MERH);        // fit the view, keeping the aspect honest
  ox = (cw - LONW*base)/2;
  oy = (ch - MERH*base)/2;
  // keep the corner furniture clear of the section
  const lift = (SECH+14)+'px';
  document.getElementById('legend').style.bottom = secOn ? lift : '14px';
  document.getElementById('src').style.bottom    = secOn ? lift : '14px';
}
function drawSection(){
  if(!secOn || SECH<10) return;
  sg.setTransform(dpr,0,0,dpr,0,0);
  sg.fillStyle='#060d16'; sg.fillRect(0,0,cw,SECH);
  sg.strokeStyle='rgba(120,160,200,.20)'; sg.lineWidth=1;
  sg.beginPath(); sg.moveTo(0,.5); sg.lineTo(cw,.5); sg.stroke();

  // where the slice crosses land, by scanline: every coastline crossing of this
  // latitude, sorted, then taken in pairs — in, out, in, out.
  const xs=[];
  for(const ring of COAST){
    for(let i=0;i<ring.length;i++){
      const a=ring[i], b=ring[(i+1)%ring.length];
      if((a[1]<=band.c) !== (b[1]<=band.c))
        xs.push(a[0] + (band.c-a[1])/(b[1]-a[1])*(b[0]-a[0]));
    }
  }
  xs.sort((u,v)=>u-v);
  sg.fillStyle='#2c4257';
  for(let i=0;i+1<xs.length;i+=2){
    const x0=X(xs[i]), x1=X(xs[i+1]);
    sg.fillRect(x0, 23, Math.max(x1-x0, 1), 8);
  }

  const top=38, bot=SECH-8, D = d => top + (d/MAXD)*(bot-top);
  sg.strokeStyle='rgba(140,190,230,.40)'; sg.lineWidth=1;   // sea level
  sg.beginPath(); sg.moveTo(34,31.5); sg.lineTo(cw,31.5); sg.stroke();
  sg.strokeStyle='rgba(90,130,170,.13)';
  sg.fillStyle='rgba(140,170,200,.55)';
  sg.font=`10px ${FONT}`;
  for(const d of [0,100,200,300,400,500,600,700]){
    const y=D(d);
    sg.beginPath(); sg.moveTo(34,y); sg.lineTo(cw,y); sg.stroke();
    sg.fillText(d===0?('0 '+T().km):d, 4, y+3.5);
  }
  const lo=band.c-band.h/2, hi=band.c+band.h/2;
  const inband = shown.filter(q=>q.lat>=lo&&q.lat<=hi&&(!playing||q.t<=animT));
  const rs = Math.pow(zoom,.42);
  for(const q of inband){
    const x=X(q.lon), y=D(Math.min(q.dep,MAXD)), r=q.r*rs;
    if(x<-r||x>cw+r) continue;
    sg.beginPath(); sg.arc(x,y,r,0,7);
    if(r>6){ sg.globalAlpha=.22; sg.fillStyle=q.col; sg.fill();
             sg.globalAlpha=.95; sg.lineWidth=Math.min(3, r*.16+1.1);
             sg.strokeStyle=q.col; sg.stroke(); }
    else   { sg.globalAlpha = q.mag>=5?.9:.68; sg.fillStyle=q.col; sg.fill(); }
  }
  sg.globalAlpha=1;
  sg.fillStyle='rgba(233,238,245,.92)'; sg.font=`600 11.5px ${FONT}`;
  sg.fillText(T().sec(lo.toFixed(1), hi.toFixed(1), inband.length.toLocaleString()), 34, 14);
}
/* the band drawn over the map, so you can see which slice you are looking at */
function drawBand(){
  if(!secOn) return;
  const y0=Y(band.c+band.h/2), y1=Y(band.c-band.h/2);
  g.fillStyle='rgba(120,190,255,.10)'; g.fillRect(0,y0,cw,y1-y0);
  g.strokeStyle='rgba(140,200,255,.55)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(0,y0+.5); g.lineTo(cw,y0+.5);
  g.moveTo(0,y1-.5); g.lineTo(cw,y1-.5); g.stroke();
}

/* ---- interaction ------------------------------------------------------ */
let drag=null;
cv.addEventListener('mousedown', e=>{
  const y=e.offsetY;
  if(secOn && y>=Y(band.c+band.h/2)-6 && y<=Y(band.c-band.h/2)+6){
    drag={mode:'band', y, c:band.c};
  } else {
    drag={mode:'pan', x:e.clientX, y:e.clientY, px:panx, py:pany};
  }
  cv.style.cursor='grabbing';
});
window.addEventListener('mouseup', ()=>{ drag=null; cv.style.cursor=''; });
window.addEventListener('mousemove', e=>{
  if(!drag) return;
  if(drag.mode==='pan'){
    panx = drag.px + (e.clientX-drag.x);
    pany = drag.py + (e.clientY-drag.y);
  } else {
    const cy = e.clientY - cv.getBoundingClientRect().top;   // window listener: offsetY
    band.c = Math.max(VIEW.s+1, Math.min(VIEW.n-1, invLat(cy)));  // is not the canvas's
  }
  render();
});
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  const k = Math.exp(-e.deltaY*0.0016);
  const nz = Math.max(1, Math.min(14, zoom*k));
  const f = nz/zoom;
  // Keep the point under the cursor pinned. X() scales about the canvas
  // CENTRE — (world - cw/2)*zoom + cw/2 + panx — so the anchor has to be
  // measured from the centre too. Using the raw offset left an error of
  // cw/2*(1-f), which slid the map sideways on every notch.
  const ax = e.offsetX - cw/2, ay = e.offsetY - ch/2;
  panx = ax - f*(ax - panx);
  pany = ay - f*(ay - pany);
  zoom = nz;
  render();
}, {passive:false});

/* hover: find the nearest visible circle, preferring the one on top ----- */
const tip=document.getElementById('tip');
cv.addEventListener('mousemove', e=>{
  if(drag){ tip.style.opacity=0; return; }
  const mx=e.offsetX, my=e.offsetY, rs=Math.pow(zoom,.42);
  let hit=null, best=Infinity;
  for(let i=shown.length-1;i>=0;i--){       // top of the draw order first
    const q=shown[i], r=Math.max(q.r*rs,4);
    const dx=X(q.lon)-mx, dy=Y(q.lat)-my, d2=dx*dx+dy*dy;
    if(d2<=r*r && d2<best){ best=d2; hit=q; if(q.mag>=6) break; }
  }
  if(!hit){ tip.style.opacity=0; return; }
  const dt=new Date(hit.t).toISOString().slice(0,10);
  tip.innerHTML =
    `<div class="m" style="color:${hit.col}">M ${hit.mag.toFixed(1)}</div>`+
    `<div class="p">${T().where(hit.dist, hit.dir, NAMES[hit.name])}</div>`+
    `<div class="d">${T().deep(Math.round(hit.dep), dt)}</div>`;
  tip.style.opacity=1;
  const tw=tip.offsetWidth, th=tip.offsetHeight;
  tip.style.left = Math.min(cw-tw-8, mx+16)+'px';
  tip.style.top  = Math.max(8, my-th-14)+'px';
});
cv.addEventListener('mouseleave', ()=>{ tip.style.opacity=0; });

/* ---- language ---------------------------------------------------------
   English is the source. Prose only is translated: the attribution line and
   the USGS place names stay English in both, and so do the numbers.        */
const DIRS_JA = ["北","北北東","北東","東北東","東","東南東","南東","南南東",
                 "南","南南西","南西","西南西","西","西北西","北西","北北西"];
const STR = {
  en: {
    title:"Earthquakes around Japan",
    sub:"Every recorded quake of magnitude 4.0 and above, 2016–2026.",
    colourDepth:"Colour — depth", sizeMag:"Size — magnitude",
    magnitude:"Magnitude", depth:"Depth", year:"Year",
    reset:"Reset", section:"Cross-section",
    play:"▶\u00a0 Play", stop:"■\u00a0 Stop",
    hint:"Scroll to zoom · drag to pan · hover a circle for detail",
    count:(n,t)=>`Showing <b>${n}</b> of <b>${t}</b> earthquakes`,
    date:d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}),
    deep:(d,date)=>`${d} km deep · ${date}`,
    where:(dist,dir,place)=> dist ? `${dist} km ${DIRS[dir]||""} of ${place}` : place,
    sec:(lo,hi,n)=>`Side view of the slice between ${lo}°N and ${hi}°N — `
      + `${n} quakes, seen from the south. Grey bar = land. `
      + `Drag the band on the map to move it.`,
    km:"km"
  },
  ja: {
    title:"日本周辺の地震",
    sub:"マグニチュード4.0以上の地震すべて（2016〜2026年）。",
    colourDepth:"色 — 深さ", sizeMag:"大きさ — マグニチュード",
    magnitude:"マグニチュード", depth:"深さ", year:"年",
    reset:"リセット", section:"断面図",
    play:"▶\u00a0 再生", stop:"■\u00a0 停止",
    hint:"スクロールで拡大・ドラッグで移動・円にカーソルを合わせると詳細",
    count:(n,t)=>`全<b>${t}</b>件のうち<b>${n}</b>件を表示`,
    date:d=>`${d.getUTCFullYear()}年${d.getUTCMonth()+1}月${d.getUTCDate()}日`,
    deep:(d,date)=>`深さ ${d} km · ${date}`,
    where:(dist,dir,place)=> dist ? `${place}の${DIRS_JA[dir]||""}${dist}km` : place,
    sec:(lo,hi,n)=>`北緯${lo}度〜${hi}度の断面を南から見た図（${n}件）。`
      + `灰色の帯は陸地。地図上の帯をドラッグすると移動します。`,
    km:"km"
  }
};
let lang = 'en';
try { const v = localStorage.getItem('quake-lang'); if(v==='en'||v==='ja') lang=v; } catch(e){}
const T = () => STR[lang];

function setLang(v){
  lang = v;
  try { localStorage.setItem('quake-lang', v); } catch(e){}
  document.documentElement.lang = v;
  for(const el of document.querySelectorAll('[data-i18n]')){
    const k = el.dataset.i18n; if(T()[k]) el.textContent = T()[k];
  }
  for(const b of document.querySelectorAll('#lang button'))
    b.classList.toggle('on', b.dataset.lang===v);
  $('play').textContent = playing ? T().stop : T().play;
  $('spd').textContent = SPEEDS[speedIdx]+'\u00d7';
  showClock(); legend(); render();
}
// the readout is owned by showClock(), which also carries the date

/* ---- controls --------------------------------------------------------- */
const $ = id => document.getElementById(id);
function pair(a,b,fillEl,lo,hi,onchange){
  const A=$(a), B=$(b), fill=$(fillEl);
  function sync(src){
    let x=+A.value, y=+B.value;
    if(x>y){ if(src==='a') B.value=x, y=x; else A.value=y, x=y; }
    const p = v => (v-lo)/(hi-lo)*100;
    fill.style.left=p(x)+'%'; fill.style.width=(p(y)-p(x))+'%';
    onchange(x,y);
  }
  A.addEventListener('input',()=>sync('a')); B.addEventListener('input',()=>sync('b'));
  return sync;
}
const syncM = pair('m0','m1','mf',4,8,(x,y)=>{
  F.m0=x; F.m1=y; $('mv').textContent = `${x.toFixed(1)} – ${y.toFixed(1)}`; update(); });
const syncD = pair('d0','d1','df',0,700,(x,y)=>{
  F.d0=x; F.d1=y; $('dv').textContent = `${x} – ${y} km`; update(); });
$('y0').max=YR1-YR0; $('y1').max=YR1-YR0; $('y1').value=YR1-YR0;
const syncY = pair('y0','y1','yf',0,YR1-YR0,(x,y)=>{
  F.y0=YR0+x; F.y1=YR0+y;
  $('yv').textContent = x===y ? `${F.y0}` : `${F.y0} – ${F.y1}`; update(); });

function update(){
  tip.style.opacity=0;   // whatever it described may have just been filtered out
  refilter(); showClock(); render();
}
function render(){ draw(); drawBand(); if(secOn) drawSection(); }

/* play: run the clock and let each quake strike as its moment arrives ----
   One frame advances the cursor by real elapsed time, so playback keeps its
   pace whatever the frame rate, and pausing loses nothing.               */
let raf = null, lastFrame = 0;
const TMAX = Q.reduce((m,q)=>Math.max(m,q.t), 0) + DAY;   // computed once
const winStart = () => Date.UTC(F.y0,0,1);
const winEnd   = () => Math.min(Date.UTC(F.y1+1,0,1), TMAX);

function frame(now){
  const dt = Math.min(now - lastFrame, 250);   // a tab that was hidden must
  lastFrame = now;                             // not jump the whole decade
  animT += dt/1000 * daysPerSec() * DAY;
  if(animT >= winEnd()){ animT = winEnd(); stopPlay(); render(); return; }
  render(); showClock();
  raf = requestAnimationFrame(frame);
}
function showClock(){
  $('clock').textContent = playing ? T().date(new Date(animT)) : '';
  $('count').innerHTML = T().count(
    (playing ? struckCount : shown.length).toLocaleString(), Q.length.toLocaleString());
}
function startPlay(){
  playing = true; animT = winStart(); lastFrame = performance.now();
  $('play').classList.add('on'); $('play').textContent = T().stop;
  showClock();                       // show the date before the first frame
  raf = requestAnimationFrame(frame);
}
function stopPlay(){
  playing = false;
  if(raf) cancelAnimationFrame(raf), raf = null;
  $('play').classList.remove('on'); $('play').textContent = T().play;
  showClock();
}
$('play').addEventListener('click', ()=> playing ? (stopPlay(), render()) : startPlay());
$('spd').addEventListener('click', ()=>{
  speedIdx = (speedIdx+1) % SPEEDS.length;
  $('spd').textContent = SPEEDS[speedIdx]+'\u00d7';
});
$('reset').addEventListener('click', ()=>{
  zoom=1; panx=0; pany=0;
  $('m0').value=4; $('m1').value=8; syncM('a');
  $('d0').value=0; $('d1').value=700; syncD('a');
  if(playing) stopPlay();
  $('y0').value=0; $('y1').value=YR1-YR0; syncY('a');
});
$('xs').addEventListener('click', ()=>{
  secOn=!secOn; $('xs').classList.toggle('on', secOn);
  $('hint').style.display = secOn ? 'none' : '';
  relayout(); render();
});

/* ---- legend ----------------------------------------------------------- */
/* the ramp puts every stop at an equal slice, which is what makes the whole
   rainbow visible; the tick labels then sit at their true positions.       */
function legend(){
  $('ramp').style.background = 'linear-gradient(90deg,' + STOPS.map((s,i)=>
    `rgb(${s[1]},${s[2]},${s[3]}) ${i/NSEG*100}%`).join(',') + ')';
  $('ticks').innerHTML = [0,30,80,250,700].map((d,i,arr)=>
    `<span>${d}${i===arr.length-1?' '+T().km:''}</span>`).join('');
  // drawn at their true radius, so the legend makes the same claim the map does
  $('msc').innerHTML = [4,5,6,7].map(m=>{
    const s = Math.max(3, radius(m)*2);
    return `<div class="mcol"><i style="width:${s}px;height:${s}px"></i><span>${m}</span></div>`;
  }).join('');
}

/* ---- go --------------------------------------------------------------- */
for(const b of document.querySelectorAll('#lang button'))
  b.addEventListener('click', ()=>setLang(b.dataset.lang));
window.addEventListener('keydown', e=>{
  if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  if(e.key==='j'||e.key==='J') setLang(lang==='ja'?'en':'ja');  // repo convention
  if(e.code==='Space'){ e.preventDefault(); $('play').click(); }
});
function boot(){ relayout(); update(); }
window.addEventListener('resize', ()=>{ relayout(); render(); });
syncM('a'); syncD('a'); syncY('a');
boot();
setLang(lang);   // paints the chrome, the legend and the map in one pass

</script>
</body>
</html>
